[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "hollyocr"
dynamic = ["version"]
description = "Conversão local de PDFs, imagens e documentos com OCR para Markdown ou texto."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Thiago Albuquerque" },
]
keywords = ["ocr", "pdf", "markdown", "tesseract", "apple-vision"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "pypdf>=6.15.0,<7",
  "pdf2image>=1.17.0,<2",
  "pytesseract>=0.3.13,<0.4",
  "Pillow>=12.3.0,<13",
  "tqdm>=4.68.0,<5",
  "python-docx>=1.2.0,<2",
  "customtkinter>=5.2.2,<6",
  "packaging>=26.0,<27",
  "PyMuPDF>=1.28.2,<1.29",
  "pymupdf4llm>=1.28.2,<1.29",
  "tkinterdnd2>=0.5.0,<0.6",
  "pyobjc-framework-Vision>=12.2.1,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=12.2.1,<13; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/HollyGM/HollyOCR"
Issues = "https://github.com/HollyGM/HollyOCR/issues"

[project.scripts]
hollyocr = "hollyocr.cli.main:main"

[project.gui-scripts]
HollyOCR = "hollyocr.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "hollyocr.version.VERSION" }

[tool.setuptools.packages.find]
include = ["hollyocr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I"]
