name: Qualidade

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system GUI support
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hollyocr/requirements.txt
          python -m pip install pytest pyflakes pip-audit
      - name: Static checks
        run: |
          python -m ruff check hollyocr tests
          python -m pyflakes hollyocr tests
      - name: Security checks
        run: python -m bandit -q -ll -r hollyocr
      - name: Dependency audit
        run: python -m pip_audit -r hollyocr/requirements.txt --progress-spinner off
      - name: Tests
        run: python -m pytest tests/ -q
